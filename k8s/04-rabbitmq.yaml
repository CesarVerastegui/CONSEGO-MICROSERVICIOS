apiVersion: apps/v1
kind: Deployment
metadata:
  name: consego-rabbitmq
  namespace: consego
  labels:
    app: consego-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consego-rabbitmq
  template:
    metadata:
      labels:
        app: consego-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: consego
spec:
  selector:
    app: consego-rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  type: ClusterIP
