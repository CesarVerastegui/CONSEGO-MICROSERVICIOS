<!doctype html>
<html lang="es">

  <title>CONSEGO - Gestión de Solicitudes de Acceso</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {

      theme: {
        extend: {
          colors: {
            "primary": "#0B132B",
            "primary-midnight": "#0B132B",
            "primary-container": "#1E3A8A",
            "on-primary-container": "#90a8ff",

            "secondary-container": "#3dbeff",
            "accent-sky": "#38BDF8",
            "accent-sky-dark": "#0284C7",
            "surface-canvas": "#F8FAFC",
            "surface-card": "#FFFFFF",
            "surface-subtle": "#F1F5F9",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "surface-container-highest": "#dae2fd",
            "border-default": "#E2E8F0",
            "border-muted": "#CBD5E1",
            "outline": "#757682",
            "outline-variant": "#c5c5d3",
            "on-surface": "#131b2e",

            mono: ["'JetBrains Mono'", "monospace"],
            "id-tabular": ["'JetBrains Mono'", "monospace"],
            "badge-mono": ["'JetBrains Mono'", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    }

<body class="bg-surface-canvas text-on-surface min-h-screen antialiased">
